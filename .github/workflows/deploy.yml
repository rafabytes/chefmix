# Compila o tema e envia por FTP para a instalação do WordPress em public_html/chefmix.
#
# Configure em Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR  (opcional; padrão abaixo, relativo à pasta inicial da conta FTP)
#              FTP_PROTOCOL    (opcional; ftps | ftp | ftps-legacy — padrão ftps)
# Sem os secrets, o build roda e o envio é pulado (com aviso).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build
          test -s dist/main.js && test -s dist/main.css

      - name: Credenciais de FTP
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Secrets FTP_SERVER/FTP_USERNAME/FTP_PASSWORD não configurados — envio pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar tema
        if: steps.ftp.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/chefmix/wp-content/themes/chefemix-theme/' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .parcel-cache/**
            src/js/**
            src/css/**
            package.json
            package-lock.json
            tailwind.config.js
            .postcssrc
            README.md
