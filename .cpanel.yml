---
# Deploy pelo cPanel (Git Version Control → Pull or Deploy → Update from Remote → Deploy HEAD Commit).
# Copia o tema para o WordPress em public_html/chefmix. O dist/ já vem compilado no repositório (sem Node no servidor).
# Pastas 755 e arquivos 644 sempre — permissão errada é a causa mais comum de 403 nos assets.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/chefmix/wp-content/themes/chefemix-theme/
    - /bin/mkdir -p $DEPLOYPATH
    - /usr/bin/rsync -rlpt --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r --exclude=.git --exclude=.github --exclude=.cpanel.yml --exclude=.gitignore --exclude=.gitattributes --exclude=node_modules --exclude=.parcel-cache --exclude=/src/js --exclude=/src/css --exclude=/package.json --exclude=/package-lock.json --exclude=/tailwind.config.js --exclude=/.postcssrc --exclude=/README.md ./ $DEPLOYPATH
